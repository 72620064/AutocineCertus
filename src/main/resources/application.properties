spring.application.name=autocine
# Configuración de la Base de Datos H2 en memoria
spring.datasource.url=jdbc:mysql://localhost:3306/autocine_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate para que cree las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Habilitar la consola web de H2 para visualizar las tablas (Opcional pero muy útil)
#spring.h2.console.enabled=true