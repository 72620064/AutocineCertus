spring.application.name=autocine

# Configuración de la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/autocine_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate para actualizar las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Desactivar el caché de Thymeleaf para ver cambios en vivo en tus vistas HTML
spring.thymeleaf.cache=false