spring.application.name=autocine
# Configuración de la Base de Datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:autocinedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración de JPA / Hibernate para que cree las tablas automáticamente
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilitar la consola web de H2 para visualizar las tablas (Opcional pero muy útil)
spring.h2.console.enabled=true